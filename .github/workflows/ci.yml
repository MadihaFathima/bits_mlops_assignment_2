name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/madihafathima/bits_mlops_assignment_2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Smoke test container
        run: |
          docker run -d --name smoke-test -p 8000:8000 $IMAGE_NAME:latest
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "Service healthy"
              break
            fi
            echo "Waiting for service..."
            sleep 2
          done
          curl -sf http://localhost:8000/health || (docker logs smoke-test && exit 1)
          docker stop smoke-test
          docker rm smoke-test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        # Pin to Git Bash explicitly. A bare "shell: bash" resolves to whichever
        # bash.exe is first on PATH, which on this machine is the WSL shim
        # (C:\Windows\System32\bash.exe) rather than Git Bash. WSL runs in its own
        # isolated network namespace, so 127.0.0.1:<port> inside WSL is NOT the same
        # as the Windows host's 127.0.0.1 that Docker Desktop's Kubernetes API server
        # binds to -- causing kubectl connection timeouts from inside WSL bash.
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}'
    steps:
      - uses: actions/checkout@v4

      - name: Apply manifests and roll out new image
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/cats-dogs-api cats-dogs-api=$IMAGE_NAME:${{ github.sha }}
          kubectl rollout status deployment/cats-dogs-api --timeout=300s

      - name: Post-deploy smoke test
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/health; then
              echo "Service healthy"
              break
            fi
            echo "Waiting for service..."
            sleep 3
          done
          curl -sf http://localhost:8080/health || (echo "Health check failed" && exit 1)
          curl -sf -X POST -F "file=@tests/fixtures/sample_dog.jpg" http://localhost:8080/predict || (echo "Predict check failed" && exit 1)
